name: Generate cyber widgets (stats + snake)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Keep the last good widgets so a failed API call never leaves a broken image.
      - name: Restore previous widgets
        run: |
          mkdir -p dist
          for f in diagnostics.svg activity.svg cyber-snake.svg; do
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/output/$f" -o "dist/$f" || rm -f "dist/$f"
          done

      - name: Build stats cards (self-hosted, no third-party stats server)
        continue-on-error: true
        env:
          # Optional: add a repo secret STATS_TOKEN (classic PAT, read:user) to include private contributions.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 assets/cyber/stats.py dist

      - name: Generate contribution snake (neon palette)
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cyber-snake.svg?palette=github-dark&color_snake=#FCEE0A&color_dots=#161B22,#3A3500,#7A7300,#BDB205,#FCEE0A

      - name: Give the snake a dark background (so it stays dark in GitHub light mode)
        run: |
          if [ -f dist/cyber-snake.svg ] && ! grep -q 'fill="#0A0B10"' dist/cyber-snake.svg; then
            sed -i 's|\(<svg[^>]*>\)|\1<rect x="-500" y="-500" width="5000" height="5000" fill="#0A0B10"/>|' dist/cyber-snake.svg
          fi

      - name: Push widgets to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
