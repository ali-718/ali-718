<svg xmlns="http://www.w3.org/2000/svg" width="600" height="76" viewBox="0 0 600 76" role="img" aria-label="NET DEPLOYMENT // WEB: Rdash 360">
<title>Rdash 360</title>
<style>
.disp{font-family:'Arial Black','Arial Bold',Impact,'Helvetica Neue',Arial,sans-serif;font-weight:900}
.mono{font-family:Consolas,'Courier New',Menlo,monospace}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.25}}
.flicker{animation:flicker 4s infinite}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FCEE0A" stroke-opacity=".07"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" opacity=".35"/></pattern>
<pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#FCEE0A"/></pattern>
<clipPath id="frame"><path d="M0 0H580L600 20V76H20L0 56Z"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="600" height="76" fill="#0A0B10"/>
<rect width="600" height="76" fill="url(#grid)"/>
<rect width="8" height="76" fill="#00F0FF"/>
<text x="26" y="28" class="mono" font-size="12" fill="#8A8F98" letter-spacing="3">NET DEPLOYMENT // WEB</text>
<text x="26" y="58" class="disp" font-size="22" fill="#FCEE0A" letter-spacing="1">Rdash 360</text>
<text x="574" y="28" text-anchor="end" class="mono" font-size="12" fill="#8A8F98" letter-spacing="2"><tspan fill="#00F0FF">●</tspan> WEB</text>
<text x="574" y="58" text-anchor="end" class="mono" font-size="18" font-weight="700" fill="#00F0FF">&gt;&gt;</text>
<line x1="26" y1="70" x2="574" y2="70" stroke="#00F0FF" stroke-width="2" stroke-dasharray="90 1200" stroke-opacity=".8"><animate attributeName="stroke-dashoffset" values="90;-600" begin="0.02s" dur="3s" repeatCount="indefinite"/></line>
<rect width="600" height="76" fill="url(#scan)"/>
</g>
<path d="M1 1H579.5L599 20.5V75H20.5L1 55.5Z" fill="none" stroke="#00F0FF" stroke-opacity=".55" stroke-width="2"/>
</svg>
