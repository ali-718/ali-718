<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="End of transmission">
<title>End of transmission</title>
<style>
.disp{font-family:'Arial Black','Arial Bold',Impact,'Helvetica Neue',Arial,sans-serif;font-weight:900}
.mono{font-family:Consolas,'Courier New',Menlo,monospace}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.25}}
.flicker{animation:flicker 4s infinite}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FCEE0A" stroke-opacity=".07"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" opacity=".35"/></pattern>
<pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#FCEE0A"/></pattern>
<clipPath id="frame"><path d="M30 0H1200V110L1170 140H0V30Z"/></clipPath>
<clipPath id="gl"><rect x="0" y="0" width="1200" height="0">
<animate attributeName="y" values="0;38;56;0" keyTimes="0;.85;.89;.93" dur="3s" calcMode="discrete" repeatCount="indefinite"/>
<animate attributeName="height" values="0;10;14;0" keyTimes="0;.85;.89;.93" dur="3s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="140" fill="#0A0B10"/>
<rect width="1200" height="140" fill="url(#grid)"/>
<text x="600" y="66" text-anchor="middle" class="disp flicker" font-size="36" fill="#FCEE0A" letter-spacing="6">END OF TRANSMISSION</text>
<text x="594" y="66" text-anchor="middle" class="disp" font-size="36" fill="#00F0FF" letter-spacing="6" clip-path="url(#gl)">END OF TRANSMISSION</text>
<rect x="0" y="96" width="1200" height="30" fill="#FCEE0A"/>
<g><animateTransform attributeName="transform" type="translate" from="0 0" to="-1400 0" dur="22s" repeatCount="indefinite"/>
<text x="0" y="117" class="mono" font-size="15" font-weight="700" fill="#0A0B10" letter-spacing="2" textLength="1400" lengthAdjust="spacingAndGlyphs">/// THANKS FOR JACKING IN /// STAY CHROME, CHOOM /// OPEN TO COLLABS &amp; GIGS /// REACT · REACT NATIVE · .NET · AZURE · AWS /// SYDNEY_AU </text>
<text x="1400" y="117" class="mono" font-size="15" font-weight="700" fill="#0A0B10" letter-spacing="2" textLength="1400" lengthAdjust="spacingAndGlyphs">/// THANKS FOR JACKING IN /// STAY CHROME, CHOOM /// OPEN TO COLLABS &amp; GIGS /// REACT · REACT NATIVE · .NET · AZURE · AWS /// SYDNEY_AU </text></g>
<rect width="1200" height="140" fill="url(#scan)"/>
</g>
<path d="M30.5 1H1199V109.5L1169.5 139H1V30.5Z" fill="none" stroke="#FCEE0A" stroke-opacity=".6" stroke-width="2"/>
</svg>
